services:
  - type: web
    name: persona-rag-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CHROMA_DIR
        value: /var/data/chroma_db
      - key: FRONTEND_URLS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: all-mpnet-base-v2
    disk:
      name: persona-rag-chroma
      mountPath: /var/data
      sizeGB: 1
